name: CI

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Aplicar migraciones
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledge_hub
          SECRET_KEY: ci-secret
        run: alembic upgrade head
      - name: Ejecutar pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledge_hub
          SECRET_KEY: ci-secret
        run: pytest tests
